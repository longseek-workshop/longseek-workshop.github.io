<style>
  /* WSDM 2027 schedule: scoped styles (copied from the CIKM 2026 tutorial site) */
  .schedule-wsdm2027 .schedule-intro-lead {

  }

    background: #f7fbfd;
  }

  .schedule-wsdm2027 .schedule-table-wrap tbody tr.row-keynote td {
    background: #fffdf5;
  }

  .schedule-wsdm2027 .schedule-table-wrap tbody tr.row-break td {
    background: #f5f5f5;
    text-align: center;
    font-weight: 600;
    color: #555;
    padding: 12px 16px;
  }

  .schedule-wsdm2027 .schedule-table-wrap .session-title {
    display: block;
    font-family: Montserrat, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    color: #222;
    margin-bottom: 10px;
    text-transform: none;
    letter-spacing: 0;
  }

  .schedule-wsdm2027 .schedule-table-wrap .session-list {
    margin: 0;
    padding-left: 1.1em;
    color: #444;
    line-height: 1.55;
  }

  .schedule-wsdm2027 .schedule-table-wrap .session-list li {
    margin-bottom: 4px;
  }

  .schedule-wsdm2027 .schedule-table-wrap .time-cell {
    font-family: Montserrat, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    color: #333;
    white-space: nowrap;
  }

  @media (max-width: 767px) {
    .schedule-wsdm2027 .schedule-table-wrap .time-cell {
      white-space: normal;
    }
  }

  .schedule-wsdm2027 .schedule-table-wrap tbody tr.row-part td {
    background: #2d2d2d;
    color: #fff;
    font-family: Montserrat, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 12px 18px;
  }

  .schedule-wsdm2027 .schedule-table-wrap .session-desc {
    display: block;
    color: #555;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .schedule-wsdm2027 .schedule-table-wrap .session-sublist {
    margin: 4px 0 2px;
    padding-left: 1.2em;
    list-style: circle;
    color: #555;
  }

  .schedule-wsdm2027 .schedule-table-wrap .part-item {
    margin-bottom: 18px;
  }

  .schedule-wsdm2027 .schedule-table-wrap .part-item:last-child {
    margin-bottom: 0;
  }

  .schedule-wsdm2027 .schedule-table-wrap .item-heading {
    display: block;
    font-weight: 700;
    color: #333;
    margin-bottom: 4px;
  }

  .schedule-wsdm2027 .schedule-table-wrap .session-list .item-name {
    font-weight: 600;
    color: #333;
  }
</style>
